<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon · Site Health</title>
<link rel="icon" type="image/svg+xml" href="assets/silvern-logo.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --brand:#1B2A4A;
    --brand-accent:#8A94A6;
    --ink:#1A1A1A;
    --gray:#6B6C6E;
    --surface:#F4F4F2;
    --card-border:#E4E4E1;
    --ok:#1F8A44;
    --warn:#C77A00;
    --down:#D11A1C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:400;
    background:var(--surface);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header{
    background:#fff;
    height:72px;
    display:flex;
    align-items:center;
    padding:0 28px;
    gap:18px;
  }
  .bmark{height:40px;width:40px;flex:none;display:block;}
  .brand-word{display:flex;flex-direction:column;justify-content:center;}
  .brand-word .co{color:var(--brand);font-weight:700;font-size:16px;line-height:1.1;letter-spacing:.2px;}
  .brand-word .co .cap{color:var(--brand-accent);font-weight:600;}
  .hdivider{width:1px;height:36px;background:#D9D9D9;flex:none;}
  .htext{display:flex;flex-direction:column;justify-content:center;}
  .htitle{color:var(--ink);font-weight:700;font-size:18px;line-height:1.15;letter-spacing:.1px;}
  .htagline{color:var(--brand);font-weight:600;font-size:12px;line-height:1.3;margin-top:2px;}
  .hsub{color:var(--gray);font-weight:400;font-size:11px;line-height:1.4;margin-top:1px;}
  .hstatus{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .hstatus .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);}
  .hstatus .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,138,68,.16);}
  .hstatus .synced{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums;}
  .rule{height:3px;background:var(--brand);}

  /* Layout */
  main{max-width:1180px;margin:0 auto;padding:28px 24px 40px;}

  /* KPI band */
  .kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .kpi{
    background:#fff;
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:16px 18px;
  }
  .kpi-label{
    text-transform:uppercase;
    font-size:11px;
    font-weight:600;
    letter-spacing:1.4px;
    color:var(--gray);
  }
  .kpi-value{
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    margin:6px 0 2px;
    font-variant-numeric:tabular-nums;
  }
  .kpi-value.alert{color:var(--down);}
  .kpi-delta{font-size:12px;color:var(--gray);}

  /* Section header */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:0 2px 14px;
  }
  .section-head h2{
    margin:0;font-size:14px;font-weight:700;color:var(--ink);
  }
  .section-head .count{font-weight:400;color:var(--gray);}
  .legend{display:flex;gap:16px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .legend .l-ok{background:var(--ok);}
  .legend .l-warn{background:var(--warn);}
  .legend .l-down{background:var(--down);}

  /* Site search */
  .searchrow{margin:0 2px 14px;}
  #store-search{
    width:100%;
    max-width:360px;
    padding:9px 12px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--card-border);
    border-radius:8px;
  }
  #store-search:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(27,42,74,.14);
  }

  /* Site grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:16px;
  }
  .card{
    background:#fff;
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:16px 18px 12px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(0,0,0,.10);
  }
  .store-name{color:var(--ink);font-weight:700;font-size:16px;letter-spacing:-.1px;}
  .store-meta{color:var(--gray);font-size:12px;margin-top:3px;}

  .pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 12px;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;
    padding:5px 11px;border-radius:6px;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .pill.ok{background:#ECF4EE;color:#1C7038;}
  .pill.ok .dot{background:var(--ok);}
  .pill.warn{background:#FaF1DF;color:#8F5B00;}
  .pill.warn .dot{background:var(--warn);}
  .pill.down{background:#FBE6E6;color:#B81618;}
  .pill.down .dot{background:var(--down);}

  .fillrow{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:13px;color:var(--gray);
    padding-top:10px;border-top:1px solid var(--card-border);
  }
  .fillrow .val{
    font-weight:700;color:var(--ink);font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .spark{height:36px;margin-top:10px;}
  .spark canvas{display:block;}

  /* Footer */
  footer{
    background:var(--ink);
    padding:11px 24px;
    margin-top:8px;
  }
  footer span{color:var(--gray);font-size:11px;}
</style>
</head>
<body>
  <header>
    <img class="bmark" src="assets/silvern-logo.svg" alt="Silvern Capital">
    <div class="brand-word">
      <span class="co">Silvern <span class="cap">Capital</span></span>
    </div>
    <div class="hdivider"></div>
    <div class="htext">
      <div class="htitle">Beacon · Site Health</div>
      <div class="htagline">Fleet health at a glance</div>
      <div class="hsub">IT Operations · Silvern Capital</div>
    </div>
    <div class="hstatus">
      <span class="live"><span class="dot"></span>Live</span>
      <span class="synced" id="synced">Synced just now</span>
      <a href="pipeline.html" style="font-size:11px;color:var(--brand);text-decoration:none;font-weight:600">Pipeline view</a>
    </div>
  </header>
  <div class="rule"></div>

  <main>
    <section class="kpis" id="kpis"></section>
    <div class="section-head">
      <h2>Site fleet <span class="count" id="store-count"></span></h2>
      <div class="legend">
        <span><i class="l-ok"></i>Operational</span>
        <span><i class="l-warn"></i>Degraded</span>
        <span><i class="l-down"></i>Down</span>
      </div>
    </div>
    <div class="searchrow">
      <input id="store-search" type="text" placeholder="Filter by site name or region…" aria-label="Filter sites by name or region">
    </div>
    <section class="grid" id="grid"></section>
  </main>

  <footer>
    <span>© 2026 Silvern Capital · Internal use only</span>
  </footer>

  <script>
    var BUILD_TAG = "beacon-site-health";
    var BRAND_COLOR = getComputedStyle(document.documentElement).getPropertyValue("--brand").trim();

    function statusLabel(kind, status){
      if (kind === "pos") return status === "down" ? "Systems down" : status === "warn" ? "Systems degraded" : "Systems up";
      return status === "down" ? "Network down" : status === "warn" ? "Network degraded" : "Network up";
    }

    function renderKpis(){
      var stores = window.STORES;
      var posDown = stores.filter(function(s){ return s.posStatus === "down"; }).length;
      var openTickets = stores.filter(function(s){ return s.openTickets > 0; }).length;
      var avgFill = stores.reduce(function(a, s){ return a + s.fillRate; }, 0) / stores.length;
      var ticketTarget = 10;

      var cards = [
        { label: "Sites monitored", value: stores.length, delta: "All regions · live" },
        { label: "Avg uptime", value: avgFill.toFixed(1) + "%", delta: "Target ≥ 95.0%" },
        { label: "Open tickets", value: openTickets, delta: "Across all sites" },
        { label: "Systems down", value: posDown, delta: posDown > 0 ? "Needs attention" : "All systems up", alert: posDown > 0 }
      ];

      document.getElementById("kpis").innerHTML = cards.map(function(k){
        return '<div class="kpi">' +
          '<div class="kpi-label">' + k.label + '</div>' +
          '<div class="kpi-value' + (k.alert ? ' alert' : '') + '">' + k.value + '</div>' +
          '<div class="kpi-delta">' + k.delta + '</div>' +
        '</div>';
      }).join("");
    }

    function renderStores(){
      document.getElementById("grid").innerHTML = window.STORES.map(function(s, i){
        return '<div class="card">' +
          '<div class="store-name">' + s.name + '</div>' +
          '<div class="store-meta">#' + s.id + ' · ' + s.region + '</div>' +
          '<div class="pills">' +
            '<span class="pill ' + s.posStatus + '"><span class="dot"></span>' + statusLabel("pos", s.posStatus) + '</span>' +
            '<span class="pill ' + s.netStatus + '"><span class="dot"></span>' + statusLabel("net", s.netStatus) + '</span>' +
            '<span class="pill ' + (s.openTickets > 2 ? "warn" : "ok") + '"><span class="dot"></span>' + s.openTickets + ' open ticket' + (s.openTickets === 1 ? "" : "s") + '</span>' +
          '</div>' +
          '<div class="fillrow"><span>Uptime</span><span class="val">' + s.fillRate.toFixed(1) + '%</span></div>' +
          '<div class="spark"><canvas id="spark-' + i + '"></canvas></div>' +
        '</div>';
      }).join("");

      window.STORES.forEach(function(s, i){
        new Chart(document.getElementById("spark-" + i), {
          type: "line",
          data: {
            labels: s.runRate7d.map(function(_, d){ return d; }),
            datasets: [{
              data: s.runRate7d,
              borderColor: BRAND_COLOR,
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.35,
              fill: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false } },
            elements: { line: { capBezierPoints: true } }
          }
        });
      });
    }

    function initSearch(){
      var input = document.getElementById("store-search");
      input.addEventListener("input", function(){
        var q = input.value.trim().toLowerCase();
        var cards = document.querySelectorAll("#grid .card");
        window.STORES.forEach(function(s, i){
          var hay = (s.name + " " + s.region).toLowerCase();
          cards[i].style.display = (q === "" || hay.indexOf(q) !== -1) ? "" : "none";
        });
      });
    }

    function renderMeta(){
      var now = new Date();
      var t = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      document.getElementById("synced").textContent = "Synced " + t;
      document.getElementById("store-count").textContent = "· " + window.STORES.length + " locations";
    }

    renderKpis();
    renderStores();
    initSearch();
    renderMeta();
  </script>
</body>
</html>
