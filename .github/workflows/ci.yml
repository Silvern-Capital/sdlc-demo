name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # The same checks the hooks run on your laptop: node tests and lint.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node tests
        run: node --test tests/*.test.js
      - name: Lint
        run: node scripts/lint.js

  e2e:
    # The browser suite. It downloads its own Chromium here, so nobody needs
    # one on their laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright chromium
        # --with-deps runs apt-get, and the runner image ships a Google
        # Chrome apt source that sometimes serves a stale index (hash
        # mismatch on dl.google.com). Nothing here needs that source, so
        # drop it before apt runs.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          npx playwright install --with-deps chromium
      - name: Run Playwright tests (headless)
        run: npx playwright test
      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
