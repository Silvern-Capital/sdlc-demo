name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # The same checks the hooks run on your laptop: node tests and lint.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node tests
        run: node --test tests/*.test.js
      - name: Lint
        run: node scripts/lint.js

  e2e:
    # The browser suite. It downloads its own Chromium here, so nobody needs
    # one on their laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests (headless)
        run: npx playwright test
      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  qa-test-gap:
    # The QA sweep's test-gap leg, as a PR comment: what has no test yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Claude QA test-gap analysis
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the qa-test-gap skill, then post the resulting table as a
            comment on PR #${{ github.event.pull_request.number }} with
            `gh pr comment`.
          claude_args: '--allowedTools "Bash(gh pr comment:*)"'
